spring.application.name=sadual

# --- Base de datos (el esquema lo crea database/01_schema.sql, JPA solo lo valida) ---
# Valores por defecto para desarrollo; en otro entorno se sobrescriben con variables
# de entorno o con application-local.properties (ignorado por git, perfil "local").
# Puerto 5433: el de docker-compose.yml (evita chocar con un PostgreSQL local en el 5432).
spring.datasource.url=${SADUAL_DB_URL:jdbc:postgresql://localhost:5433/sadual}
spring.datasource.username=${SADUAL_DB_USER:postgres}
spring.datasource.password=${SADUAL_DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Seguridad (JWT HS256) ---
# El secreto debe tener al menos 32 caracteres. El de aquí es SOLO para desarrollo.
sadual.jwt.secreto=${SADUAL_JWT_SECRET:sadual-dev-secreto-solo-desarrollo-cambiar-2026}
sadual.jwt.duracion=PT8H
sadual.cors.origenes=http://localhost:4200

# Zona horaria de negocio: las franjas se interpretan en hora peninsular.
sadual.zona-horaria=Europe/Madrid

# --- Reglas de reserva (docs/requisitos-cliente.md) ---
# P4: perfiles con reservas individuales (añadir EXTERNO cuando se abra a usuarios externos)
sadual.reservas.perfiles-permitidos=ALUMNADO,PDI,PAS,ADMIN
# P2: antelación mínima para reservar (sin máximo)
sadual.reservas.antelacion-minima=PT3H
